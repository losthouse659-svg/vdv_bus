<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1220" />
  <title>VDV Bus Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Live tracking</p>
        <h1>Autobusy VDV &ndash; Kraj Vysočina</h1>
      </div>
      <div class="status-card">
        <span class="status-dot" id="statusDot"></span>
        <div>
          <p class="status-label">Stav</p>
          <p id="statusText">Načítám data…</p>
        </div>
      </div>
    </header>
    <main class="content">
      <section class="panel">
        <div class="panel-head">
          <h2>Aktuální poloha spojů</h2>
          <button id="refreshBtn" type="button">Obnovit</button>
        </div>
        <div class="map-wrap">
          <div id="map"></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
