<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <title>Mapa autobusů VDV</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
</head>
<body>
  <div id="map"></div>

  <!-- Status badge vpravo nahore -->
  <div id="status-badge">
    <span id="statusDot"></span>
    <span id="statusText">Načítám...</span>
    <button id="refreshBtn" title="Obnovit">↻</button>
  </div>

  <!-- Sidebar tlacitko -->
  <button id="toggleSide" title="Seznam spojů">☰</button>

  <!-- Sidebar panel -->
  <div id="sidePanel">
    <div id="sidePanelHeader">
      <span>Spoje</span>
      <button id="sideClose">✕</button>
    </div>
    <div id="sideList"></div>
  </div>

  <!-- Detail panel -->
  <div id="detailPanel">
    <button id="detailClose">✕</button>
    <div id="detailBody"></div>
  </div>

  <script src="./assets/js/app.js"></script>
</body>
</html>
